
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Followers | Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="login-card">

            <div class="brand">Instagram</div>

            <div class="promo">
                <span class="tag">DEMO PROMOTION</span>
                <h1>Get 10,000 Followers</h1>
                <p>
                    Preview a free-follower promotion using
                    a demo username. No Instagram login required.
                </p>
            </div>

            <form id="demoForm">
                <label for="username">Demo username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter a demo username"
                    autocomplete="off"
                    required
                >

                <label for="password">Test password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Use a fictional password"
                    autocomplete="new-password"
                    required
                >

                <p class="privacy">
                    Demo only. Never enter your real Instagram password.
                </p>

                <button type="submit">Continue</button>
            </form>

            <div id="result" class="result" hidden></div>

            <div class="separator">
                <span></span>
                <p>OR</p>
                <span></span>
            </div>

            <p class="secondary">
                This practice page is not affiliated with Instagram.
            </p>
        </section>

        <footer>
            HTML · CSS · JavaScript practice
        </footer>
    </main>

    <script>
        const form = document.getElementById("demoForm");
        const username = document.getElementById("username");
        const password = document.getElementById("password");
        const result = document.getElementById("result");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const user = username.value.trim().replace(/^@/, "");

            if (!user || !password.value) return;

            // The password is never read, saved, or transmitted.
            result.hidden = false;
            result.textContent =
                "Demo successful! @" + user +
                " has selected the 10,000-follower promotion preview. " +
                "No account was accessed and followers were added. Enjoy!";

            password.value = "";
        });
    </script>

</body>
</html>
